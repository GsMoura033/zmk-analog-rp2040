CONFIG_ZMK_USB=y
CONFIG_ZMK_HID_INDICATORS=n

# Analog stick -> mouse
CONFIG_ZMK_POINTING=y
CONFIG_ADC=y
CONFIG_ADC_ASYNC=y
CONFIG_INPUT=y
CONFIG_ANALOG_INPUT=y
# Driver DEVICE_DT_INST_DEFINE uses CONFIG_SENSOR_INIT_PRIORITY
CONFIG_SENSOR=y
# RP2040 needs gain=1 channel cfg from DT (driver default is nRF GAIN_1_6)
CONFIG_ANALOG_INPUT_USE_DTS_ADC_CH_CFG=y

# USB CDC console (pair with snippet zmk-usb-logging in build.yaml)
# AIN live lines are rate-limited in the driver (~10 Hz) for the tuner UI.
CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000
CONFIG_ANALOG_INPUT_LOG_LEVEL_INF=y
CONFIG_ANALOG_INPUT_LOG_DBG_RAW=y
CONFIG_ANALOG_INPUT_LOG_DBG_REPORT=n

# Persist stick calibration across power cycles (stick save)
CONFIG_SETTINGS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# Shell commands for psp-stick-tuner (stick mid/deadzone/divisor/...)
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
# SENSOR_SHELL selects CBPRINTF_FP_SUPPORT which breaks RP2040 Kconfig
CONFIG_SENSOR_SHELL=n

# USB-powered pointer — no deep sleep
CONFIG_ZMK_SLEEP=n
